# FastAPI 等 Python 项目：Ruff、pyright、pytest、Alembic 迁移检查
# 测试通过后，可以在仓库根目录再运行项目 Makefile 中的目标（make-targets），例如 OpenAPI 是否最新
name: python-ci

on:
  workflow_call:
    inputs:
      working-directory:
        description: Python 项目所在目录，例如 services/api
        type: string
        default: "."
      python-version:
        type: string
        default: "3.14"
      postgres:
        description: 是否启动 PostgreSQL 测试数据库
        type: boolean
        default: true
      postgres-image:
        description: >-
          测试数据库的镜像，应与生产环境的 PostgreSQL 主版本一致。
          启用 pgvector 时改为 pgvector/pgvector 的对应标签，例如 pgvector/pgvector:pg17
        type: string
        default: "postgres:17"
      make-targets:
        description: >-
          测试通过后，在仓库根目录依次运行的 make 目标，空格分隔，例如 "openapi-check"。
          默认为空，不运行
        type: string
        default: ""

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    services:
      postgres:
        image: ${{ inputs.postgres && inputs.postgres-image || '' }}
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 仅用于 CI 的测试数据库，不是真实密码
      DATABASE_URL: postgresql://app:app@localhost:5432/app
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
          cache-dependency-glob: ${{ inputs.working-directory }}/uv.lock

      - name: 安装依赖
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: pyright
        run: uv run pyright

      - name: 检查迁移只有一个 head
        if: hashFiles(format('{0}/alembic.ini', inputs.working-directory)) != ''
        run: |
          out="$(uv run alembic heads)"
          heads="$(printf '%s\n' "$out" | grep -c '(head)' || true)"
          if [ "$heads" -gt 1 ]; then
            echo "::error::Alembic 有 $heads 个 head，请合并迁移。"
            printf '%s\n' "$out"
            exit 1
          fi

      - name: 运行迁移
        if: inputs.postgres && hashFiles(format('{0}/alembic.ini', inputs.working-directory)) != ''
        run: uv run alembic upgrade head

      - name: pytest
        run: uv run pytest

      # 在仓库根目录运行（job 的默认目录是 working-directory）。依赖已经在上面安装好了
      - name: make 目标
        if: inputs.make-targets != ''
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          TARGETS: ${{ inputs.make-targets }}
        run: |
          for target in $TARGETS; do
            echo "::group::make $target"
            make "$target"
            echo "::endgroup::"
          done
