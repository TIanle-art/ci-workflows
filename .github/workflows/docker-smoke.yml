# 构建镜像、启动容器、做端到端冒烟测试；失败时输出容器日志，最后总是清理
# 依赖项目 Makefile 中的目标，名称默认与 template-backend-fastapi 一致：
#   build（构建镜像）、docker-up（先迁移再启动）、smoke（端到端冒烟）、
#   docker-logs（输出容器日志）、docker-down（停止并清理）
# 可以在 targets 里加入其他目标，例如 "caddy-check build docker-up smoke"
name: docker-smoke

on:
  workflow_call:
    inputs:
      targets:
        description: 依次运行的 make 目标，空格分隔
        type: string
        default: "build docker-up smoke"
      logs-target:
        description: 任何一步失败时运行的 make 目标，用来输出容器日志
        type: string
        default: "docker-logs"
      down-target:
        description: 最后总是运行的 make 目标，用来停止并清理容器
        type: string
        default: "docker-down"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: 运行 make 目标
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          for target in $TARGETS; do
            echo "::group::make $target"
            make "$target"
            echo "::endgroup::"
          done

      - name: 失败时输出容器日志
        if: failure()
        env:
          LOGS_TARGET: ${{ inputs.logs-target }}
        run: |
          # 日志输出本身失败不能掩盖前面真正的失败原因
          make "$LOGS_TARGET" || true

      - name: 清理
        if: always()
        env:
          DOWN_TARGET: ${{ inputs.down-target }}
        run: make "$DOWN_TARGET"
