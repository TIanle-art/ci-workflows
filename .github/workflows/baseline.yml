# 所有项目都调用：密钥扫描、公司 Skill 同步检查
name: baseline

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: gitleaks 版本号（不带 v）
        type: string
        default: "8.30.1"

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 gitleaks（校验 checksum）
        env:
          VERSION: ${{ inputs.gitleaks-version }}
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/gitleaks_${VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: 扫描密钥
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # PR 只扫描本次新增的提交
            gitleaks git --redact --log-opts="$BASE_SHA..$HEAD_SHA"
          else
            gitleaks git --redact
          fi

      - name: 检查公司 Skill 是否同步
        run: |
          if [ -f scripts/check-skills.sh ]; then
            bash scripts/check-skills.sh
          else
            echo "没有 scripts/check-skills.sh，跳过"
          fi
